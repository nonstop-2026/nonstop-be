[project]
name = "nonstop-be"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "firebase-admin>=7.7.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
